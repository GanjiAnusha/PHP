<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marriage Biodata Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .collapsible-section {
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            max-height: 3000px;
        }
        .collapsible-section.collapsed {
            max-height: 0;
        }
        :root {
      --color-maroon: #910b3d;
      --color-maroon-dark: #720832;
    }
    </style>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            maroon: 'var(--color-maroon)',
            'maroon-dark': 'var(--color-maroon-dark)'
          }
        }
      }
    }
  </script>
</head>
<body>

<div class="flex flex-col md:flex-row justify-center items-start gap-8 py-12 bg-gradient-to-t from-yellow-50 to-white min-h-screen">
  
  <!-- Biodata Form -->
  <form id="biodataForm" class="bg-white rounded-xl shadow-lg p-8 w-full max-w-xl">
    <!-- <h2 class="text-2xl font-bold mb-6 text-yellow-600">Marriage Biodata</h2> -->
    <h2 class="text-2xl font-bold mb-6 text-[#910b3d]">Marriage Biodata</h2>


    <!-- Personal Details Section with Collapsible Toggle -->
    <div class="mb-6">
      <div class="flex items-center justify-between cursor-pointer bg-yellow-50 p-3 rounded-lg hover:bg-yellow-100 transition-colors" onclick="toggleSection('personalSection')">
      <h3 class="text-xl font-bold text-maroon">Personal Details</h3>
          <button type="button" class="text-maroon hover:text-maroon-dark transition-transform duration-200" id="personalToggle">
            <svg class="w-5 h-5 transform transition-transform duration-200" fill="currentColor" viewBox="0 0 20 20">
              <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
            </svg>
          </button>

      </div>
      
      <!-- Collapsible Personal Details Fields -->
      <div id="personalSection" class="mt-4 space-y-5 collapsible-section">
        
        <!-- Name -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Name
              <input type="text" name="name" data-label="Name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500 text-lg" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Date of Birth -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Date of Birth
              <input type="date" name="date_of_birth" data-label="Date of Birth" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Time of Birth -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Time of Birth
              <input type="time" name="time_of_birth" data-label="Time of Birth" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Gender -->
        <div class="field-container mb-5" data-section="Personal">
          <label class="block mb-1 font-medium text-gray-700">Gender</label>
          <div class="flex items-center gap-8">
            <div>
              <label class="inline-flex items-center mr-4">
                <input type="radio" name="gender" value="Male" data-label="Gender" class="form-radio text-maroon focus:ring-yellow-500"/>
                <span class="ml-2 text-gray-800">Male</span>
              </label>
              <label class="inline-flex items-center">
                <input type="radio" name="gender" value="Female" data-label="Gender" class="form-radio text-maroon focus:ring-yellow-500"/>
                <span class="ml-2 text-gray-800">Female</span>
              </label>
            </div>
            <div class="flex flex-col gap-1 items-center ml-auto">
              <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
              <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
            </div>
          </div>
        </div>

        <!-- Star -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Star
              <input type="text" name="star" data-label="Star" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Raasi -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Raasi
              <input type="text" name="raasi" data-label="Raasi" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Place of Birth -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Place of Birth
              <input type="text" name="place_of_birth" data-label="Place of Birth" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Hometown -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Hometown
              <input type="text" name="hometown" data-label="Hometown" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Height -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Height
              <input type="text" name="height" data-label="Height" placeholder="e.g., 5'6\"" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Complexion -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Complexion
              <select name="complexion" data-label="Complexion" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500">
                <option value="">Select Complexion</option>
                <option value="Fair">Fair</option>
                <option value="Wheatish">Wheatish</option>
                <option value="Dark">Dark</option>
                <option value="Very Fair">Very Fair</option>
              </select>
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Religion -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Religion
              <input type="text" name="religion" data-label="Religion" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Caste -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Caste
              <input type="text" name="caste" data-label="Caste" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Gotra -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Personal">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Gotra
              <input type="text" name="gotra" data-label="Gotra" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

      </div>
    </div>

    <div class="mb-6">
      <div class="flex items-center justify-between cursor-pointer bg-yellow-50 p-3 rounded-lg hover:bg-yellow-100 transition-colors"
          onclick="toggleSection('educationSection')">
        <h3 class="text-xl font-bold text-maroon">Education Qualification</h3>
        <button type="button" class="text-maroon hover:text-maroon-dark transition-transform duration-200" id="educationToggle">
          <svg class="w-5 h-5 transform transition-transform duration-200 fill-current" viewBox="0 0 20 20">
            <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
          </svg>
        </button>
      </div>
      <div id="educationSection" class="mt-4 space-y-5 collapsible-section collapsed">
        <div class="field-container mb-5 flex items-start gap-3" data-section="Education">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Highest Qualification</label>
            <input type="text" name="highestqualification" data-label="Highest Qualification"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500 text-lg" />
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>
        <div class="field-container mb-5 flex items-start gap-3" data-section="Education">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Institution/University</label>
            <input type="text" name="institution" data-label="Institution/University"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>
        <div class="field-container mb-5 flex items-start gap-3" data-section="Education">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Year of Passing</label>
            <input type="text" name="yearofpassing" data-label="Year of Passing"
                  placeholder="e.g., 2020" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Family Details Section with Collapsible Toggle -->
    <div class="mb-6">
      <div class="flex items-center justify-between cursor-pointer bg-yellow-50 p-3 rounded-lg hover:bg-yellow-100 transition-colors" onclick="toggleSection('familySection')">
      <h3 class="text-xl font-bold text-maroon">Family Details</h3>
          <button type="button" class="text-maroon hover:text-maroon-dark transition-transform duration-200" id="familyToggle">
            <svg class="w-5 h-5 transform transition-transform duration-200" fill="currentColor" viewBox="0 0 20 20">
              <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
            </svg>
          </button>
      </div>
      
      <div id="familySection" class="mt-4 space-y-5 collapsible-section">
        
        <!-- Father's Name -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Father's Name
              <input type="text" name="father_name" data-label="Father's Name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500 text-lg" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Father's Occupation -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Father's Occupation
              <input type="text" name="father_occupation" data-label="Father's Occupation" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Mother's Name -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Mother's Name
              <input type="text" name="mother_name" data-label="Mother's Name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500 text-lg" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Mother's Occupation -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Mother's Occupation
              <input type="text" name="mother_occupation" data-label="Mother's Occupation" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Number of Brothers -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Number of Brothers
              <input type="number" name="brothers_count" data-label="Number of Brothers" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Number of Sisters -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Number of Sisters
              <input type="number" name="sisters_count" data-label="Number of Sisters" min="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500" />
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Family Type -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Family Type
              <select name="family_type" data-label="Family Type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500">
                <option value="">Select Family Type</option>
                <option value="Nuclear">Nuclear Family</option>
                <option value="Joint">Joint Family</option>
                <option value="Extended">Extended Family</option>
              </select>
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Family Income -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Family Income
              <select name="family_income" data-label="Family Income" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500">
                <option value="">Select Income Range</option>
                <option value="Below 2 Lakh">Below ₹2 Lakh</option>
                <option value="2-5 Lakh">₹2-5 Lakh</option>
                <option value="5-10 Lakh">₹5-10 Lakh</option>
                <option value="10-20 Lakh">₹10-20 Lakh</option>
                <option value="20-50 Lakh">₹20-50 Lakh</option>
                <option value="Above 50 Lakh">Above ₹50 Lakh</option>
              </select>
            </label>
          </div>
          <div class="flex flex-col gap-1 pt-7 shrink-0 max-w-fit">
            <button type="button" class="move-up text-maroon hover:text-maroon-dark font-bold" title="Move Up">▲</button>
            <button type="button" class="move-down text-maroon hover:text-maroon-dark font-bold" title="Move Down">▼</button>
          </div>
        </div>

        <!-- Family Values -->
        <div class="field-container mb-5 flex items-start gap-3" data-section="Family">
          <div class="flex-grow">
            <label class="block mb-1 font-medium text-gray-700">Family Values
              <select name="family_values" data-label="Family Values" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-yellow-500 focus:ring-yellow-500">
                <option value="">Select Family Values</option>
                <option value="Traditional">Traditional</option>
                <option value="Moderate">Moderate</option>
                <option value="Liberal">Liberal</option>
              </select>
            </label>
          </div>

<script>
// Toggle Section Function
function toggleSection(sectionId) {
  const section = document.getElementById(sectionId);
  const toggle = document.getElementById(sectionId.replace('Section', 'Toggle'));
  
  if (section.classList.contains('collapsed')) {
    // Expand section
    section.classList.remove('collapsed');
    toggle.classList.remove('rotate-180');
  } else {
    // Collapse section
    section.classList.add('collapsed');
    toggle.classList.add('rotate-180');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('biodataForm');
  const previewContainer = document.getElementById('previewContainer');
  
  // Move up/down functionality
  form.addEventListener('click', (e) => {
    if (e.target.classList.contains('move-up')) {
      const field = e.target.closest('.field-container');
      const parent = field.parentNode;
      const prev = field.previousElementSibling;
      if (prev && prev.classList.contains('field-container')) {
        parent.insertBefore(field, prev);
        updatePreview();
        updateModalPreview();
      }
    }
    
    if (e.target.classList.contains('move-down')) {
      const field = e.target.closest('.field-container');
      const parent = field.parentNode;
      const next = field.nextElementSibling;
      if (next && next.classList.contains('field-container')) {
        parent.insertBefore(next, field);
        updatePreview();
        updateModalPreview();
      }
    }
  });

  // Image upload preview
  const imgInput = form.querySelector('input[name="profile_image"]');
  const imgPreview = document.getElementById('preview-profile_image');
  const modalImgPreview = document.getElementById('modal-profile-image');
  
  imgInput.addEventListener('change', () => {
    const file = imgInput.files[0];
    if (file) {
      const imageUrl = URL.createObjectURL(file);
      imgPreview.src = imageUrl;
      imgPreview.classList.remove('hidden');
      modalImgPreview.src = imageUrl;
      modalImgPreview.classList.remove('hidden');
    } else {
      imgPreview.src = '';
      imgPreview.classList.add('hidden');
      modalImgPreview.src = '';
      modalImgPreview.classList.add('hidden');
    }
  });
  

  // Dynamic preview update function (for side panel)
  function updatePreview() {
    previewContainer.innerHTML = '';
    
    // Group fields by section in their current order
    const sectionData = {
      'Personal': { title: 'Personal Details', fields: [] },
      'Education': { title: 'Education Qualification', fields: [] },
      'Family': { title: 'Family Details', fields: [] },
      'Contact': { title: 'Contact Information', fields: [] },
      'Image': { title: 'Image', fields: [] }
    };

    // Get all field containers in their current DOM order
    const fieldContainers = [...form.querySelectorAll('.field-container')];
    
    fieldContainers.forEach(container => {
      const section = container.getAttribute('data-section');
      
      // Find input/textarea/select in this container
      const input = container.querySelector('input[name], textarea[name], select[name]');
      if (input) {
        let value = '';
        let label = input.getAttribute('data-label') || '';
        
        if (input.type === 'radio') {
          const checkedRadio = container.querySelector('input[name="' + input.name + '\"]:checked');
          value = checkedRadio ? checkedRadio.value : '';
        } else if (input.type === 'date') {
          value = input.value ? new Date(input.value).toLocaleDateString() : '';
        } else if (input.type === 'time') {
          value = input.value || '';
        } else if (input.tagName === 'SELECT') {
          value = input.value || '';
        } else {
          value = input.value.trim();
        }
        
        if (value && section && sectionData[section]) {
          sectionData[section].fields.push({ label, value });
        }
      }
    });

    // Render sections with data
    Object.values(sectionData).forEach(section => {
      if (section.fields.length > 0) {
        // Create section heading
        const heading = document.createElement('span');
        heading.className = 'text-xl font-bold mb-3 block';
        heading.textContent = section.title;
        previewContainer.appendChild(heading);

        // Create section content
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'mb-4';
        
        section.fields.forEach(field => {
          const fieldDiv = document.createElement('div');
          fieldDiv.className = 'mb-2';
          fieldDiv.innerHTML = `${field.label}: <span class="font-medium">${field.value}</span>`;
          sectionDiv.appendChild(fieldDiv);
        });
        
        previewContainer.appendChild(sectionDiv);
      }
    });
  }

  // Modal preview update function
  function updateModalPreview() {
    const modalPreviewContent = document.getElementById('modal-preview-content');
    modalPreviewContent.innerHTML = '';
    
    // Get current template
    const selectedTemplate = document.querySelector('.template-option.selected')?.getAttribute('data-template') || 'clean';
    
    // Apply template styling
    let templateClasses = '';
    let titleClasses = '';
    let sectionClasses = '';
    let fieldClasses = '';
    
    switch(selectedTemplate) {
      case 'yellow':
        templateClasses = 'bg-yellow-50 border-yellow-200';
        titleClasses = 'text-maroon border-b-2 border-maroon';
        sectionClasses = 'text-maroon bg-yellow-100 rounded';
        fieldClasses = 'text-black-900';
        break;
      case 'elegant':
        templateClasses = 'bg-gradient-to-br from-blue-50 to-purple-50 border-purple-200';
        titleClasses = 'text-purple-800 border-b-2 border-purple-300';
        sectionClasses = 'text-purple-700 bg-white rounded shadow-sm';
        fieldClasses = 'text-gray-800';
        break;
      default: // clean
        templateClasses = 'bg-white border-gray-200';
        titleClasses = 'text-gray-800 border-b-2 border-gray-300';
        sectionClasses = 'text-gray-700 bg-gray-50 rounded';
        fieldClasses = 'text-gray-800';
    }
    
    modalPreviewContent.className = `relative z-10 p-8 ${templateClasses} rounded-lg`;
    
    // Group fields by section in their current order
    const sectionData = {
      'Personal': { title: 'Personal Details', fields: [] },
      'Education': { title: 'Education Qualification', fields: [] },
      'Family': { title: 'Family Details', fields: [] },
      'Contact': { title: 'Contact Information', fields: [] },
      'Image': { title: 'Image', fields: [] }
    };

    // Get all field containers in their current DOM order
    const fieldContainers = [...form.querySelectorAll('.field-container')];
    
    fieldContainers.forEach(container => {
      const section = container.getAttribute('data-section');
      
      // Find input/textarea/select in this container
      const input = container.querySelector('input[name], textarea[name], select[name]');
      if (input) {
        let value = '';
        let label = input.getAttribute('data-label') || '';
        
        if (input.type === 'radio') {
          const checkedRadio = container.querySelector('input[name="' + input.name + '\"]:checked');
          value = checkedRadio ? checkedRadio.value : '';
        } else if (input.type === 'date') {
          value = input.value ? new Date(input.value).toLocaleDateString() : '';
        } else if (input.type === 'time') {
          value = input.value || '';
        } else if (input.tagName === 'SELECT') {
          value = input.value || '';
        } else if (input.type === 'file') {
          // Skip file inputs in modal content
          return;
        } else {
          value = input.value.trim();
        }
        
        if (value && section && sectionData[section]) {
          sectionData[section].fields.push({ label, value });
        }
      }
    });

    // Add main title
    const mainTitle = document.createElement('h1');
    mainTitle.className = `text-2xl font-bold mb-6 pb-2 text-center ${titleClasses}`;
    mainTitle.textContent = 'Marriage Biodata';
    modalPreviewContent.appendChild(mainTitle);

    // Render sections with data
    Object.values(sectionData).forEach(section => {
      if (section.fields.length > 0) {
        // Create section heading
        const heading = document.createElement('h2');
        heading.className = `text-lg font-bold mb-3 p-2 ${sectionClasses}`;
        heading.textContent = section.title;
        modalPreviewContent.appendChild(heading);

        // Create section content
        const sectionDiv = document.createElement('div');
        sectionDiv.className = 'mb-6 ml-4';
        
        section.fields.forEach(field => {
          const fieldDiv = document.createElement('div');
          fieldDiv.className = `mb-2 ${fieldClasses}`;
          fieldDiv.innerHTML = `<strong>${field.label}:</strong> ${field.value}`;
          sectionDiv.appendChild(fieldDiv);
        });
        
        modalPreviewContent.appendChild(sectionDiv);
      }
    });
  }

  // Attach input/change event listeners for preview updates
  const inputs = form.querySelectorAll('input[type="text"], input[type="email"], input[type="date"], input[type="time"], input[type="number"], textarea, select');
  inputs.forEach((input) => {
    input.addEventListener('input', () => {
      updatePreview();
      updateModalPreview();
    });
    input.addEventListener('change', () => {
      updatePreview();
      updateModalPreview();
    });
  });
  
  const radios = form.querySelectorAll('input[type="radio"]');
  radios.forEach((radio) => radio.addEventListener('change', () => {
    updatePreview();
    updateModalPreview();
  }));

  // Modal controls
  const openPreviewBtn = document.getElementById("open-preview");
  const previewModal = document.getElementById("preview-modal");
  const closePreviewBtn = document.getElementById("close-preview");

  openPreviewBtn.addEventListener("click", () => {
    updateModalPreview();
    previewModal.classList.remove("hidden");
    previewModal.classList.add("flex");
  });

  closePreviewBtn.addEventListener("click", () => {
    previewModal.classList.add("hidden");
    previewModal.classList.remove("flex");
  });

  // Template switching
  document.querySelectorAll(".template-option").forEach(option => {
    option.addEventListener("click", () => {
      // Remove selected class from all templates
      document.querySelectorAll(".template-option").forEach(t => {
        t.classList.remove("selected", "border-yellow-500");
        t.classList.add("border-gray-300");
      });
      
      // Add selected class to clicked template
      option.classList.add("selected", "border-black-500");
      option.classList.remove("border-gray-300");
      
      // Update modal preview with new template
      updateModalPreview();
    });
  });

  // Enable Download only when agreed
  const agreeCheckbox = document.getElementById("agree");
  const downloadBtn = document.getElementById("download-pdf");

  agreeCheckbox.addEventListener("change", () => {
    downloadBtn.disabled = !agreeCheckbox.checked;
    downloadBtn.classList.toggle("bg-green-600", agreeCheckbox.checked);
    downloadBtn.classList.toggle("hover:bg-green-700", agreeCheckbox.checked);
    downloadBtn.classList.toggle("bg-gray-400", !agreeCheckbox.checked);
  });

  // PDF Download
  downloadBtn.addEventListener("click", () => {
    const element = document.getElementById("preview-wrapper");
    const opt = {
      margin: 0.5,
      filename: 'marriage-biodata.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { 
        scale: 2,
        useCORS: true,
        letterRendering: true
      },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  });

  // Initial preview update
  updatePreview();
});
</script>
